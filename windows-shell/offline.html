<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POS Canvas</title>
    <!--
      Feature 23.1 — the honest failure page.

      WHAT THIS PAGE IS NOT, and must never become: it is not an offline mode.
      POS Canvas requires a connection to take payments, and this page says so
      plainly rather than implying a degraded-but-working till. It carries no
      cached menu, no cached prices, no configuration, no pairing state, no
      credentials and no project data. It is a message and a button.

      Copy matches the tone the device runtime already uses for the same
      situation (DEVICE_ERROR_MESSAGES.offline in lib/deviceSession.ts): say
      what happened, say what to do, promise nothing.

      Self-contained by necessity — it is shown precisely when the network is
      not working, so it references no font, stylesheet, script or image that
      would have to be fetched.
    -->
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #fafafa;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        text-align: center;
      }

      main {
        max-width: 26rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: #525252;
      }

      button {
        margin-top: 0.75rem;
        padding: 0.75rem 2rem;
        border: 0;
        border-radius: 9999px;
        background: #2563eb;
        color: #ffffff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>POS Canvas couldn&rsquo;t connect.</h1>

      <p>
        Check your internet connection and try again. POS Canvas needs a
        connection to take payments.
      </p>

      <button id="retry" type="button">Retry</button>
    </main>

    <script>
      // The button signals intent only. It holds no URL: the shell's main
      // process owns the destination, so this page cannot be pointed anywhere
      // and needs no knowledge of whether it is retrying a development server or
      // production.
      const button = document.getElementById("retry");

      button.addEventListener("click", () => {
        button.disabled = true;
        button.textContent = "Retrying…";

        window.posCanvasShell.retry();

        // Re-enable if the retry fails and this page is shown again without a
        // fresh document, so the button never becomes permanently dead.
        window.setTimeout(() => {
          button.disabled = false;
          button.textContent = "Retry";
        }, 4000);
      });
    </script>
  </body>
</html>
