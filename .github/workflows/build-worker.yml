# Feature 17.1 — Production Build Execution.
# Feature 17.2 — demand-triggered: the schedule was REMOVED.
#
# Runs the EXISTING one-shot build worker (worker/once.ts) so a hosted
# customer's build request is processed without anyone running a terminal
# command. Nothing about the worker or its database RPCs changes here; this
# file only supplies an execution environment.
#
# WHY THERE IS NO LONGER A SCHEDULE: 17.1 polled every 15 minutes, so an owner
# waited up to 15 minutes for a build that takes seconds, and ~96 runs a day
# fired against an empty queue. POS Canvas now dispatches this workflow itself
# (lib/githubBuildWorker.server.ts) the moment a build job is queued, so a run
# happens when — and only when — there is a reason for one.
#
# WHY THIS IS SAFE TO RUN CONCURRENTLY WITH ITSELF OR A MANUAL RUN:
# claim_next_build_job (supabase/migrations/20260729175512) selects its
# candidate FOR UPDATE SKIP LOCKED, mints a fresh claim_token on every claim,
# and every subsequent transition RPC requires that exact token plus an
# unexpired lease. Two workers therefore cannot claim the same job, and a
# worker whose lease lapsed cannot mutate anything afterwards. The database is
# the authority; the `concurrency` block below is only about cost and log
# noise. That property is what makes an occasional duplicate dispatch — a
# double-clicked Build button — harmless rather than something to prevent.
#
# STALE-JOB RECOVERY NOW RIDES ON DEMAND, NOT ON A CLOCK. Reclaiming a build
# whose worker died, and force-failing one that has exhausted its 3 attempts,
# both still happen INSIDE claim_next_build_job, and nothing else performs that
# recovery. With no schedule, that recovery only runs when this workflow is
# dispatched. POS Canvas therefore dispatches for a job in `building` as well
# as one in `queued` (lib/buildJobs.ts::needsBuildProcessing) — a job stuck
# `building` after a dead worker also blocks its project's active-job index, so
# every later Build click resolves to it, and each of those clicks is what
# brings a worker back to reclaim it. Manual `Run workflow` below remains the
# operator's fallback if POS Canvas itself cannot reach GitHub.

name: Build worker

on:
  # The emergency fallback, and the ONLY trigger. Used when POS Canvas cannot
  # reach the GitHub API, or to catch up a backlog by hand.
  #
  # Every ordinary run arrives through this same trigger via the REST API:
  # POST /repos/:owner/:repo/actions/workflows/build-worker.yml/dispatches.
  workflow_dispatch:
    inputs:
      environment:
        description: Which backend to process
        type: choice
        options:
          - staging
          - production
        # STAGING BY DEFAULT, so the dangerous option is always the one someone
        # had to choose on purpose. A dispatch that forgets to say which backend
        # it means gets the harmless answer.
        default: staging
        required: true

# No `schedule`, no `push`, no `pull_request`, and never `pull_request_target`.
# This repository is PUBLIC, so a fork's pull request must never be able to
# start a run that holds a service-role credential, and the absence of those
# triggers is what guarantees it.
#
# CORRECTION. An earlier version of this comment claimed that "dispatched runs
# execute only from the default branch, so a workflow edited on a side branch
# cannot run with these secrets until it is merged." That is WRONG, and relying
# on it would have been a real hole: workflow_dispatch accepts a `ref`, runs the
# workflow file and the code from that ref, and repository secrets are available
# to branch dispatches — the fork restriction applies to pull_request, not to
# this.
#
# What actually confines production credentials to `main` is the `production`
# GitHub Environment's deployment-branch rule. That is a platform-enforced
# guarantee rather than a property of this file, which is why the job below
# selects an environment instead of reading repository secrets directly.

# Least privilege. The worker reads and writes Supabase, never this repository.
permissions:
  contents: read

# Serialize runs. Overlap is already safe at the database level, so this is not
# a correctness control — it prevents redundant runs and keeps logs readable.
# cancel-in-progress is false on purpose: cancelling mid-run could kill a worker
# after it claimed a job, leaving that job 'building' until its lease expires
# and burning one of its three attempts for no reason.
#
# Feature 17.2 — expect to see cancelled runs here, and expect them to be fine.
# A concurrency group holds at most one running plus one pending run; a third
# dispatch cancels the pending one before it ever starts a job. So a burst of
# Build clicks collapses to the in-flight run plus one queued behind it, and
# the cancelled entries never claimed anything.
concurrency:
  group: build-worker
  cancel-in-progress: false

jobs:
  process-queue:
    name: Process queued Android builds
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # THE ROLLOUT GATE, in place BEFORE there is anything to gate.
    #
    # There is no `schedule` trigger yet, so `github.event_name` is never
    # 'schedule' and this condition is always true today — it changes nothing
    # about how this workflow behaves. It is here first on purpose: when a
    # schedule is added later, it arrives already gated, rather than existing
    # ungated for however long it takes to add the guard.
    #
    # An unset BUILD_WORKER_SCHEDULE_ENABLED is an empty string, so absent reads
    # as disabled — the safe direction, and the state this merges in. Manual
    # dispatch is deliberately never gated: the gate exists to hold back
    # autonomous recovery, not to take away the operator's fallback.
    if: github.event_name != 'schedule' || vars.BUILD_WORKER_SCHEDULE_ENABLED == 'true'

    # WHICH BACKEND THIS RUN MAY TOUCH, and the only thing that decides it.
    #
    # Selecting an Environment is what makes the choice enforceable rather than
    # conventional: `staging` and `production` hold their own copies of the two
    # secrets, so the same variable names resolve to different backends with no
    # expression juggling — and therefore no `||` that could silently fall
    # through to production if a staging secret were missing.
    #
    # The 'schedule' branch of this expression is likewise inert until a
    # schedule exists; it is written now so the eventual behaviour is decided
    # here, in review, rather than in the commit that adds the cron.
    environment: ${{ github.event_name == 'schedule' && 'production' || inputs.environment }}

    steps:
      # FAIL CLOSED BEFORE ANY WORKER CALL.
      #
      # The Environment already decides which secrets this run gets, so this is
      # not the primary control — it is the one that catches the failure the
      # Environment cannot: a staging Environment whose URL was pasted wrong, or
      # a production value typed into it. Without this, such a run would process
      # the wrong backend while its log said otherwise.
      #
      # WHAT IT PRINTS is the Supabase project ref and nothing else. That ref is
      # not a secret — it is the subdomain of NEXT_PUBLIC_SUPABASE_URL, which is
      # shipped to every browser by definition. The service-role key is never
      # echoed, never derived from, and never passed to this step at all; only
      # the URL is. GitHub would mask it regardless, and this does not rely on
      # that.
      #
      # The expected refs live in repository VARIABLES rather than in this file
      # because the repository is public: they are not sensitive, but there is
      # no reason to publish them.
      #
      # Placed FIRST so a misconfigured run fails in seconds rather than after
      # a checkout and a full npm install.
      - name: Confirm which backend this run will touch
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPECTED_REF: ${{ github.event_name == 'schedule' && vars.PRODUCTION_PROJECT_REF || (inputs.environment == 'production' && vars.PRODUCTION_PROJECT_REF || vars.STAGING_PROJECT_REF) }}
        run: |
          set -euo pipefail

          ref="${NEXT_PUBLIC_SUPABASE_URL#https://}"
          ref="${ref%%.*}"

          echo "Resolved Supabase project ref: ${ref}"
          echo "Expected for this run:        ${EXPECTED_REF}"

          # An unset expectation is a misconfiguration, not a licence to guess.
          if [ -z "${EXPECTED_REF}" ]; then
            echo "::error::No expected project ref is configured for this run."
            exit 1
          fi

          if [ "${ref}" != "${EXPECTED_REF}" ]; then
            echo "::error::This run resolved to project ${ref}, which is not the expected backend. Refusing to process any build."
            exit 1
          fi

      # Checks out the ref this run was triggered on — the dispatched branch for
      # a manual run. Named accordingly: the earlier name claimed it was always
      # the default branch, which was the same mistake as the trigger comment
      # above.
      - name: Check out the triggering ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # The worker runs through tsx, which is a devDependency, so the full
      # install is required. --omit=dev would break it.
      - name: Install dependencies
        run: npm ci

      - name: Process up to 5 queued Android builds
        env:
          # Injected as environment values, never interpolated into the command
          # text below — an interpolated secret can surface in a trace or an
          # error line. worker/once.ts reads exactly these two variables
          # (lib/supabase/adminConfig.ts) and no others.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          # Bounded and finite: exactly five one-shot invocations, never a
          # polling loop. Each is a fresh process making one claim attempt.
          #
          # The batch is NOT stopped early when the queue empties. The worker
          # exits 0 both when it completes a build and when it finds nothing to
          # do, and the two are distinguishable only by the "no_job_available"
          # line in its JSON log. That log shape is a convention, not a
          # contract, so parsing it would let a future formatting change
          # silently break batching. An extra invocation against an empty queue
          # costs one RPC that returns no rows, which is not worth that risk.
          #
          # A non-zero exit IS the contract, and `set -e` stops the batch and
          # fails the run on the first one.
          for attempt in 1 2 3 4 5; do
            echo "worker invocation ${attempt} of 5"
            npm run worker:run -- --target android
          done
