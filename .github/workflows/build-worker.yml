# Feature 17.1 — Production Build Execution.
# Feature 17.2 — demand-triggered: the schedule was REMOVED.
#
# Runs the EXISTING one-shot build worker (worker/once.ts) so a hosted
# customer's build request is processed without anyone running a terminal
# command. Nothing about the worker or its database RPCs changes here; this
# file only supplies an execution environment.
#
# WHY THERE IS NO LONGER A SCHEDULE: 17.1 polled every 15 minutes, so an owner
# waited up to 15 minutes for a build that takes seconds, and ~96 runs a day
# fired against an empty queue. POS Canvas now dispatches this workflow itself
# (lib/githubBuildWorker.server.ts) the moment a build job is queued, so a run
# happens when — and only when — there is a reason for one.
#
# WHY THIS IS SAFE TO RUN CONCURRENTLY WITH ITSELF OR A MANUAL RUN:
# claim_next_build_job (supabase/migrations/20260729175512) selects its
# candidate FOR UPDATE SKIP LOCKED, mints a fresh claim_token on every claim,
# and every subsequent transition RPC requires that exact token plus an
# unexpired lease. Two workers therefore cannot claim the same job, and a
# worker whose lease lapsed cannot mutate anything afterwards. The database is
# the authority; the `concurrency` block below is only about cost and log
# noise. That property is what makes an occasional duplicate dispatch — a
# double-clicked Build button — harmless rather than something to prevent.
#
# STALE-JOB RECOVERY NOW RIDES ON DEMAND, NOT ON A CLOCK. Reclaiming a build
# whose worker died, and force-failing one that has exhausted its 3 attempts,
# both still happen INSIDE claim_next_build_job, and nothing else performs that
# recovery. With no schedule, that recovery only runs when this workflow is
# dispatched. POS Canvas therefore dispatches for a job in `building` as well
# as one in `queued` (lib/buildJobs.ts::needsBuildProcessing) — a job stuck
# `building` after a dead worker also blocks its project's active-job index, so
# every later Build click resolves to it, and each of those clicks is what
# brings a worker back to reclaim it. Manual `Run workflow` below remains the
# operator's fallback if POS Canvas itself cannot reach GitHub.

name: Build worker

on:
  # The emergency fallback, and the ONLY trigger left. Used when POS Canvas
  # cannot reach the GitHub API, or to catch up a backlog by hand.
  #
  # Every ordinary run arrives through this same trigger via the REST API:
  # POST /repos/:owner/:repo/actions/workflows/build-worker.yml/dispatches.
  workflow_dispatch:

# No `schedule`, no `push`, no `pull_request`, and never `pull_request_target`.
# The production service-role credential must never be reachable from code in a
# pull request, least of all a fork's. Dispatched runs execute only from the
# default branch, so a workflow edited on a side branch cannot run with these
# secrets until it is merged.

# Least privilege. The worker reads and writes Supabase, never this repository.
permissions:
  contents: read

# Serialize runs. Overlap is already safe at the database level, so this is not
# a correctness control — it prevents redundant runs and keeps logs readable.
# cancel-in-progress is false on purpose: cancelling mid-run could kill a worker
# after it claimed a job, leaving that job 'building' until its lease expires
# and burning one of its three attempts for no reason.
#
# Feature 17.2 — expect to see cancelled runs here, and expect them to be fine.
# A concurrency group holds at most one running plus one pending run; a third
# dispatch cancels the pending one before it ever starts a job. So a burst of
# Build clicks collapses to the in-flight run plus one queued behind it, and
# the cancelled entries never claimed anything.
concurrency:
  group: build-worker
  cancel-in-progress: false

jobs:
  process-queue:
    name: Process queued Android builds
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # The worker runs through tsx, which is a devDependency, so the full
      # install is required. --omit=dev would break it.
      - name: Install dependencies
        run: npm ci

      - name: Process up to 5 queued Android builds
        env:
          # Injected as environment values, never interpolated into the command
          # text below — an interpolated secret can surface in a trace or an
          # error line. worker/once.ts reads exactly these two variables
          # (lib/supabase/adminConfig.ts) and no others.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          # Bounded and finite: exactly five one-shot invocations, never a
          # polling loop. Each is a fresh process making one claim attempt.
          #
          # The batch is NOT stopped early when the queue empties. The worker
          # exits 0 both when it completes a build and when it finds nothing to
          # do, and the two are distinguishable only by the "no_job_available"
          # line in its JSON log. That log shape is a convention, not a
          # contract, so parsing it would let a future formatting change
          # silently break batching. An extra invocation against an empty queue
          # costs one RPC that returns no rows, which is not worth that risk.
          #
          # A non-zero exit IS the contract, and `set -e` stops the batch and
          # fails the run on the first one.
          for attempt in 1 2 3 4 5; do
            echo "worker invocation ${attempt} of 5"
            npm run worker:run -- --target android
          done
