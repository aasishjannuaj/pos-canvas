# Feature 23.4 — the authoritative build path for the universal Windows app.
#
# WHY A WINDOWS RUNNER AND NOT A MAC. electron-builder can sometimes emit an
# NSIS installer from macOS, but it is not the path its maintainers test, and
# Authenticode signing (Feature 23.6) cannot happen there at all. A release
# artifact that only one developer's laptop can reproduce is not a release
# process. This workflow is the gate; a local cross-build is a convenience.
#
# WHAT THIS PRODUCES: one unsigned NSIS installer,
# POS-Canvas-Windows-v<version>.exe, plus its SHA-256, uploaded as workflow
# artifacts. It does NOT create a GitHub Release, does NOT sign anything, and
# does NOT make Windows downloadable anywhere in the product — Windows stays
# "Coming Soon" until Feature 23.6, after Feature 23.5 has validated the
# installer on real Windows x64.
#
# THE BINARY IS UNIVERSAL. Nothing project-, customer- or build-specific enters
# it: the shell contains one hardcoded origin and no configuration at all. There
# is deliberately no input to this workflow that could vary the output per
# customer, because a per-customer Windows binary is the thing this product's
# architecture exists to avoid.
#
# NO SECRETS ARE REQUIRED OR REFERENCED. The shell is a static wrapper with no
# Supabase credentials, so unlike the build worker this job needs no environment
# at all. That is worth preserving: a build that needs no secret cannot leak one.

name: Windows app

on:
  # Manual only, for now. A tag trigger is deliberately deferred until the
  # artifact has been validated on real Windows hardware (Feature 23.5) — an
  # automatic build of an unvalidated installer would invite treating it as
  # releasable.
  workflow_dispatch:

# Least privilege. This job reads the repository and uploads workflow artifacts;
# it never writes to the repository and never creates a Release. Artifact upload
# does not require `contents: write`.
permissions:
  contents: read

concurrency:
  group: windows-app
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: windows-shell

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          # BOTH lockfiles. This job installs two separate npm projects: the
          # repository root (which owns the device runtime's build) and
          # windows-shell (which owns Electron and electron-builder).
          cache-dependency-path: |
            package-lock.json
            windows-shell/package-lock.json

      # ------------------------------------------------------------------
      # THE DEVICE RUNTIME. This must exist before packaging, and until
      # Feature 25.6 it did not.
      #
      # windows-shell/runtime/ is gitignored build output, so a fresh CI
      # checkout does not contain it. electron-builder's files glob includes
      # "runtime/**/*", which matched NOTHING — so this workflow packaged an
      # Electron installer with no POS inside it. The app installed, launched,
      # failed to fetch app://poscanvas/index.html and sat on the offline page
      # forever. The installer-size check below could not catch it: Electron
      # alone is ~95 MB, far above the 40 MB floor.
      #
      # The runtime is built from the ROOT project (native-device/ + vite),
      # which is why the root dependencies are installed here even though the
      # packaging steps below run inside windows-shell.
      # ------------------------------------------------------------------
      - name: Install root dependencies
        working-directory: .
        run: npm ci

      # The two PUBLIC values Next.js already inlines into every browser
      # bundle it serves. They are client configuration, not credentials —
      # read as repository variables, falling back to secrets so the job works
      # with whichever the repository already has configured. A service-role
      # key is a server credential and is deliberately not available here.
      - name: Build the packaged device runtime
        working-directory: .
        run: npm run windows:runtime
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # FAIL CLOSED, BEFORE PACKAGING. A missing runtime must stop the build
      # here rather than ship as a silently empty installer.
      - name: Verify the packaged runtime exists and targets the right backend
        shell: pwsh
        working-directory: .
        env:
          EXPECTED_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          $entry = "windows-shell/runtime/index.html"

          if (-not (Test-Path $entry)) {
            Write-Host "The packaged device runtime is missing: $entry"
            Write-Host "windows-shell/runtime contains:"
            if (Test-Path "windows-shell/runtime") {
              Get-ChildItem -Recurse "windows-shell/runtime" | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "  (the directory does not exist)"
            }
            Write-Host ""
            Write-Host "npm run windows:runtime must succeed before packaging."
            exit 1
          }

          $bundles = Get-ChildItem "windows-shell/runtime/assets" -Filter *.js -ErrorAction SilentlyContinue

          if (-not $bundles) {
            Write-Host "No JavaScript bundle under windows-shell/runtime/assets."
            exit 1
          }

          $js = ($bundles | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"

          # The backend is asserted against the URL THIS JOB WAS GIVEN, never a
          # ref hardcoded in the repository. That keeps the assertion honest for
          # any environment and puts no project identifier into tracked source.
          $expected = $env:EXPECTED_SUPABASE_URL

          if ([string]::IsNullOrWhiteSpace($expected)) {
            Write-Host "NEXT_PUBLIC_SUPABASE_URL is not configured for this workflow."
            Write-Host "Set it as a repository variable (or secret). See windows-shell/README.md."
            exit 1
          }

          if ($js -notlike "*$expected*") {
            Write-Host "The built runtime does not target the configured Supabase URL."
            exit 1
          }

          # The established negative assertion: a server credential must never
          # reach a customer-installable artifact.
          foreach ($banned in @("service_role", "SUPABASE_SERVICE_ROLE_KEY")) {
            if ($js -like "*$banned*") {
              Write-Host "The built runtime contains a forbidden string: $banned"
              exit 1
            }
          }

          Write-Host "runtime ok: $entry"
          Write-Host "bundles: $($bundles.Count)"

      # The shell is a separate npm project; its dependency tree provides
      # Electron and electron-builder, which the root project does not carry.
      - name: Install shell dependencies
        run: npm ci

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          npx --no-install electron-builder --version

      # Fails loudly if the Electron binary did not materialise. `npm ci` has
      # been observed to defer Electron's postinstall download, and a build that
      # silently packages nothing is worse than one that stops here.
      # The command lives in a literal block scalar, not a plain one. A plain
      # YAML scalar may not contain ": " (colon-space) — that sequence is the
      # mapping key/value indicator, so `Error('Electron binary missing: '+p)`
      # made the parser try to start a new mapping entry mid-value. Inside a
      # block scalar the same text is just data.
      - name: Verify the Electron binary is present
        run: |
          node -e "const p=require('electron');const fs=require('fs');if(typeof p!=='string'||!fs.existsSync(p)){throw new Error('Electron binary missing: '+p)}console.log('electron binary ok:',p)"

      - name: Build the NSIS installer
        run: npm run build:windows

      # ------------------------------------------------------------------
      # Verification. The filename is part of the contract — the product's
      # release metadata (Feature 23.6) will reference it — so an unexpected
      # name fails the build rather than being renamed afterwards.
      # ------------------------------------------------------------------
      - name: Verify the installer and record its checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name = "POS-Canvas-Windows-v$version.exe"
          $path = Join-Path "dist" $name

          if (-not (Test-Path $path)) {
            Write-Host "Expected installer not found: $path"
            Write-Host "dist contains:"
            Get-ChildItem dist | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          $size = (Get-Item $path).Length
          Write-Host "installer: $name"
          Write-Host "size: $size bytes"

          # An NSIS installer wrapping Electron is tens of megabytes. Anything
          # trivially small means the build produced a stub.
          if ($size -lt 40MB) {
            Write-Host "Installer is implausibly small ($size bytes)."
            exit 1
          }

          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256: $hash"

          # Same two-column format as `shasum -a 256`, so the file verifies with
          # the standard tools on any platform.
          "$hash  $name" | Out-File -FilePath "$path.sha256" -Encoding ascii -NoNewline

      - name: Upload the installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: pos-canvas-windows-v1.1.0
          if-no-files-found: error
          retention-days: 30
          path: |
            windows-shell/dist/POS-Canvas-Windows-v*.exe
            windows-shell/dist/POS-Canvas-Windows-v*.exe.sha256
